<ng-container *ngIf="translationService.translations$ | async as t">
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Loading Overlay -->
      <div class="loading-overlay" *ngIf="isLoading">
        <div class="spinner"></div>
      </div>

      <!-- Top: small logo -->
      <div class="card-header">
        <img src="/assets/images/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
      </div>

      <div class="card-body">
        
        <!-- LOGIN VIEW -->
        <form *ngIf="currentView === 'login'" [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form fade-in">
          <div class="form-group">
            <label>{{ t.NIC || 'National Identity Card' }} <span class="req">*</span></label>
            <input type="text" formControlName="nic" placeholder="e.g. 981234567V">
          </div>
          <div class="form-group password-group" style="position: relative;">
            <label>{{ t.PASSWORD || 'Password' }} <span class="req">*</span></label>
            <div class="password-input-wrapper" style="position: relative; display: flex; align-items: center;">
              <input [type]="showPassword ? 'text' : 'password'" formControlName="password" style="width: 100%; padding-right: 40px;">
              <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'" (click)="togglePasswordVisibility()" style="position: absolute; right: 12px; cursor: pointer; color: #6b7280; font-size: 16px;"></i>
            </div>
          </div>
          
          <div class="form-group">
            <label>{{ t.ROLE || 'Select Role' }} <span class="req">*</span></label>
            <select formControlName="role" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; background: #fff;">
              <option value="" disabled selected>{{ t.SELECT_ROLE || 'Choose your role' }}</option>
              <option value="Citizen">Citizen</option>
              <option value="GN Officer">GN Officer</option>
              <option value="DS Officer">DS Officer</option>
            </select>
          </div>
          
          <button type="submit" class="primary-btn">{{ t.LOGIN || 'Login' }}</button>

          <!-- Links under Login Button -->
          <div class="form-links centered">
            <a href="javascript:void(0)" (click)="setView('forgot')">{{ t.FORGOT_PASSWORD || 'Forgot Password?' }}</a>
          </div>
        </form>



        <!-- FORGOT PASSWORD VIEW -->
        <form *ngIf="currentView === 'forgot'" [formGroup]="forgotForm" (ngSubmit)="onSendOtp()" class="auth-form fade-in">
          <h2 class="sub-title">{{ t.FORGOT_PASSWORD || 'Forgot Password' }}</h2>
          <p class="desc">{{ t.FORGOT_PASSWORD_DESC || 'Enter your NIC or Email to receive an OTP' }}</p>
          <div class="form-group">
            <label>{{ t.EMAIL_NIC || 'NIC or Email' }} <span class="req">*</span></label>
            <input type="text" formControlName="emailNic">
          </div>
          
          <button type="submit" class="primary-btn">{{ t.SEND_OTP || 'Send OTP' }}</button>

          <div class="form-links centered">
             <a href="javascript:void(0)" class="cancel-link" (click)="setView('login')">Cancel & Back to {{ t.LOGIN || 'Login' }}</a>
          </div>
        </form>

        <!-- RESET PASSWORD VIEW -->
        <form *ngIf="currentView === 'reset'" [formGroup]="resetForm" (ngSubmit)="onResetPassword()" class="auth-form fade-in">
          <h2 class="sub-title">{{ t.RESET_PASSWORD || 'Reset Password' }}</h2>
          <div class="form-group">
            <label>{{ t.OTP || 'OTP' }} <span class="req">*</span></label>
            <input type="text" formControlName="otp">
          </div>
          <div class="form-group">
            <label>{{ t.NEW_PASSWORD || 'New Password' }} <span class="req">*</span></label>
            <input type="password" formControlName="newPassword">
          </div>
          <div class="form-group">
            <label>Confirm Password <span class="req">*</span></label>
            <input type="password" formControlName="confirmPassword">
          </div>
          
          <button type="submit" class="primary-btn">{{ t.RESET_PASSWORD || 'Confirm' }}</button>

          <div class="form-links centered">
             <a href="javascript:void(0)" class="cancel-link" (click)="setView('login')">Cancel & Back to Login</a>
          </div>
        </form>
      </div> <!-- end card-body -->

      <!-- Bottom Right language toggler -->
      <div class="card-footer">
        <div class="lang-switcher">
          <select #langSelect [value]="translationService.currentLang" (change)="switchLanguage(langSelect.value)" class="lang-dropdown">
            <option value="en">English (EN)</option>
            <option value="si">සිංහල (SI)</option>
            <option value="ta">தமிழ் (TA)</option>
          </select>
        </div>
      </div>
    
    </div> <!-- end auth-card -->

    <!-- Toast Alert -->
    <div class="toast" [ngClass]="['toast-' + toastType, toastMessage ? 'show' : '']">
      {{ toastMessage }}
    </div>

  </div> <!-- end auth-wrapper -->
</ng-container>
