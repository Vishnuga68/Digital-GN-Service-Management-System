<div class="new-request-container fade-in">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left">
      <button class="back-link" (click)="goBack()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Main Page
      </button>
      <h1>New Service Request</h1>
      <p>Submit your digital request directly to the Grama Niladhari division.</p>
    </div>
    <div class="header-right">
      <div class="minimal-help">
        <div class="help-icon-box-small">
          <img src="/assets/icons/question.png" alt="query">
        </div>
        <div class="help-text-small">
          <h4>Have a Question?</h4>
          <a routerLink="/citizen/help" class="minimal-link">Open Documentation →</a>
        </div>
      </div>
    </div>
  </div>

  <div class="request-grid">
    <!-- Main Column -->
    <div class="main-column">
      
      <!-- Step 1: Service Selection Grid -->
      <div class="panel-card service-selection-panel">
        <div class="panel-header">
          <div class="title-with-icon">
            <img src="/assets/icons/request_new.png" alt="Service Selection">
            <h3>Choose a Service Type</h3>
          </div>
        </div>
        <div class="panel-body">
          <div *ngFor="let heading of headings" class="category-block">
            <h4 class="category-title">
              <img [src]="heading.icon" alt="category icon" class="cat-icon-small">
              {{ heading.parentHeadingName }}
            </h4>
            <div class="services-modern-grid">
              <div *ngFor="let s of heading.services" 
                   class="service-card-modern"
                   (click)="selectService(s)">
                <div class="service-icon-wrapper">
                    <img [src]="s.icon" alt="service">
                </div>
                <div class="service-info">
                  <span class="service-name">{{ s.serviceName }}</span>
                  <span class="service-desc-short">{{ s.description | slice:0:55 }}...</span>
                </div>
                <div class="select-indicator">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
