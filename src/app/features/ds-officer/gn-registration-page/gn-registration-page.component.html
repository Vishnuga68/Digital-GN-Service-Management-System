<div class="page-container fade-in">
  <header class="page-header">
    <div class="header-content">
      <h1>Register New GN Officer</h1>
      <p>Create a new Grama Niladhari officer account and assign them to a division.</p>
    </div>
  </header>

  <div class="content-card narrow">
    <form (ngSubmit)="registerGN()" #gnForm="ngForm" class="registration-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" [(ngModel)]="newGN.name" name="name" required placeholder="Enter full name">
        </div>
        <div class="form-group">
          <label>NIC Number</label>
          <input type="text" [(ngModel)]="newGN.nic" name="nic" required placeholder="Enter NIC">
        </div>
        <div class="form-group">
          <label>GN Division</label>
          <input type="text" [(ngModel)]="newGN.division" name="division" required placeholder="e.g. J/60">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="newGN.email" name="email" required placeholder="Enter email">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" [(ngModel)]="newGN.phone" name="phone" required placeholder="+94 7X XXX XXXX">
        </div>
        <div class="form-group">
          <label>Temporary Password</label>
          <div class="password-display">
            <code>{{ newGN.tempPassword }}</code>
            <span class="helper-text">Officer must reset this on first login.</span>
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="!gnForm.form.valid">Create GN Account</button>
      </div>
    </form>
  </div>
</div>
